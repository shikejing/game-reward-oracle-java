server.port=8080

# 奖励规则：名次 -> 额度（未配置的名次为 0）
reward.rank-amounts[1]=100
reward.rank-amounts[2]=50
reward.rank-amounts[3]=20
# 并列名次处理：SPLIT_SUM（合并占用名次额度均分，余数按 playerId 序分配）或 EACH_FULL（每人全额）
reward.tie-policy=SPLIT_SUM
# 结算前修订窗口（毫秒），自首次上报收到时刻起算，闭区间
reward.revision-window-ms=60000
# 本地事件日志目录
reward.store.dir=./data
