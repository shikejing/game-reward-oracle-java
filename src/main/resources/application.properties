server.port=0

# 本地文件持久化（进程内 H2，不依赖外部服务）
spring.datasource.url=jdbc:h2:file:${reward.db.path:./data}/reward
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 奖励规则：修订窗口时长（毫秒），默认 5 分钟
reward.rule.window-ms=300000
# 未配置名次的默认奖励
reward.rule.default-amount=0
# 各名次奖励额度（key 为名次，从 1 开始）
reward.rule.rank-rewards.1=100
reward.rule.rank-rewards.2=60
reward.rule.rank-rewards.3=30

# 测试用：模拟慢领取的延迟（毫秒），生产保持 0
reward.test.slow-claim-ms=0
